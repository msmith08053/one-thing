<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>One Thing</title>
  <meta name="description" content="One task each, every day, your plans together — and a home you build as you go.">
  <meta name="theme-color" content="#FFF8EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="One Thing">
  <link rel="manifest" href="manifest.webmanifest?v=6">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=6">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=6">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=6">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=6">
  <link rel="shortcut icon" href="icons/favicon-32.png?v=6">
  <link rel="stylesheet" href="styles.css?v=6.1">
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <div id="app">
    <main id="main"><div class="center muted">Loading…</div></main>
    <nav id="tabs" aria-label="Main" hidden>
      <button data-tab="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
      <button data-tab="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Tasks</button>
      <button data-tab="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Events</button>
      <button data-tab="lists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Lists</button>
      <button data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    </nav>
    <button id="fab" aria-label="Add a task" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="fx" aria-hidden="true"></div>
  <dialog id="editDialog"></dialog>
  <dialog id="sheet"></dialog>
  <dialog id="levelDialog"></dialog>
  <script type="module" src="app.js?v=6.1"></script>
</body>
</html>
